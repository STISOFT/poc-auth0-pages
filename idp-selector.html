<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Auth0 POC - Selecciona tu cuenta</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrapper">
    <header class="main-header">
      <a title="Portal Empresa Demo" href="index.html" class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true"><rect width="52" height="52" rx="12" fill="#2563eb"/><text x="26" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">ACME</text></svg>
        <hr /> <span>EMPRESA</span>
      </a>
    </header>

    <main class="main-container">
      <div class="main-container__left-section">
        <div class="main-container__form">
          <h2>Ingresa a tu Portal Empresa Demo</h2>
          <!-- Auth0 ACUL renders the identity-provider selector inside this element at runtime -->
          <div id="api" role="main">
            [Auth0 ACUL identity-provider selector placeholder]
          </div>
        </div>
      </div>

      <div class="main-container__right-section">
        <div class="main-container__right-section__info-cards">
          <div class="main-container__right-section__info-cards__card-title">
            <h3>
              Tu aliado en la <br />
              gestión de tu
              <span class="main-container__right-section__highlight">empresa</span>
            </h3>
          </div>

          <div class="main-container__right-section__info-cards__card">
            <div class="main-container__right-section__card-icon">💳</div>
            <p>
              <span class="main-container__right-section__highlight">Crea QR y asígnalos a tus</span>
              cajas, colaboradores, locales o <br />servicios
            </p>
          </div>

          <div class="main-container__right-section__info-cards__card">
            <div class="main-container__right-section__card-icon">📊</div>
            <p>
              <span class="main-container__right-section__highlight">Organiza el cobro de tus ventas</span>
              y genera reportes más detallados.
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer class="main-footer"></footer>
  </div>
</body>
</html>
